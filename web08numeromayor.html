<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function getNumeroMayor(){
            let numero1= 99;
            let numero2= 89;
            //necesito evaluar qe numero es mayor de los dos
            //tambien si son iguales
            //y mostrar alert con dicho numero mayor o son iguales
            if(numero1>numero2){
                alert("El numero mayor es 99");
            } else if(numero2>numero1){
                alert("El numero mayor es 89");
            } else {
                alert("Los numeros son iguales");
            }

        }
    </script>
</head>
<body>
    <h1>numero mayor <h1>
        <button onclick="getNumeroMayor()">
        Numero mayor
</body>
</html>
