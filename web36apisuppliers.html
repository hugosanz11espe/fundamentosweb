<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        async function leerServicioSuppliers() {
            //antes era path porque era una ruta, ahora utilizamos URL
            let url = "https://services.odata.org/V4/Northwind/Northwind.svc/Suppliers";
            let response = await fetch(url);
            let datos = await response.json();
            console.log(datos);
            //necesitamos un contenido para el dibujo HTML
            let contenido = "";
            //recorremos todos los proveedores/suppliers
            for (let proveedor of datos.value) {
                contenido += `
                <li> ${proveedor.ContactName} </li>
                `
            }
            let lista = document.getElementById("listasuppliers");
            lista.innerHTML = contenido;
        }
    </script>
</head>
<body>
    <h1>Service Api Suppliers</h1> 
    https://services.odata.org/V4/Northwind/Northwind.svc/
    <button onclick="leerServicioSuppliers()">Servicio Suppliers</button>
    <ul id="listasuppliers"></ul>

</body>
</html>
