<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        async function leerJsonClientes() {
            let path= "documentos/clientes.json";
            let respuesta = await fetch(path);
            let datos = await respuesta.json(); 
            console.log(datos); 
            let contenido ="";
            //viene un conjunto de clientes 
            //recorremos cada cliente de los datos 
            for(let cliente of datos){
                //dibujamos el nombre de cada cliente en la lista
                contenido+= "<li>"+cliente.nombre+"</li>"; 
            }

            //buscamos la lista de clientes en html
            let lista  = document.getElementById("ListaClientes");
            //dibujamos el contenido
            lista.innerHTML = contenido; 



        }

    </script>
</head>
<body>
    <h1>Lectura JSON clientes</h1>
    <button onclick="leerJsonClientes()">Leer JSON clientes</button>
    <ul id="ListaClientes"></ul> 
</body>
</html>
