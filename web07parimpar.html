<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function evaluarNumero(){
            let numero= 14;
            //necesito saber si el numero es par o impar
            if(numero%2==0){
                alert("El numero 14 es par");
            } else {
                alert("El numero 14 es impar");
            }
        }

    </script>
</head>
<body>
    <h1>Ejemplopar/impar</h1>
    <button onclick="evaluarNumero()">
        Evaluar número
    </button>
</body>
</html>
