<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function sumarNumeros() {
            let cajanumero1= document.getElementById("cajanumero1")
            let cajanumero2= document.getElementById("cajanumero2")
            let resultado= document.getElementById("resultado")
            let valor1= parseInt(cajanumero1.value);
            let valor2= parseInt(cajanumero2.value);
            let suma= valor1 + valor2;
            resultado.innerText= "EL resultado de la suma es:" + suma;



        }
    </script>
</head>
<body>
    <h1>Sumar numero <h1>
        Numero 1:
        <input type="number" id="cajanumero1"/>
         Numero 2:
         <input type="number" id="cajanumero2"/>
         <br/>
         <button onclick="sumarNumeros()">Sumar numeros</button>
         <h3 id="resultado">La suma es</h3>
</body>
</html>
